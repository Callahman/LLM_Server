# Reference config for the Pi's murmurd.
#
# The Debian/Ubuntu `mumble-server` package installs /etc/mumble-server.ini;
# adjust it as needed. Most values below are the package defaults.
#
# SuperUser password is NOT set in this file — use:
#   sudo dpkg-reconfigure mumble-server
# (you will be prompted for the current and new SuperUser passwords)

# Mumble's standard default port
port=64738

# Server log
logfile=/var/log/mumble-server/mumble-server.log

# SQLite database (registered users, ACLs)
database=/var/lib/mumble-server/murmur.sqlite3

# Shown to clients on connect
welcometext=Home Mumble server
